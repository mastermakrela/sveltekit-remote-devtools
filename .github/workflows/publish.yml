name: CI

# Every push is checked; a push to main publishes when package.json has a version npm doesn't have yet.
on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), no token secret

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

      - name: Publish new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "sveltekit-remote-devtools@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm"
          else
            npm publish
          fi
